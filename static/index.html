<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>HealthLens</title><link rel="stylesheet" href="/static/style.css"></head>
<body><aside class="sidebar" id="sidebar"><a class="brand" href="/">✳ <span>HealthLens</span></a>
<button id="new-chat" class="secondary">＋ New chat</button>
<div class="dataset-card"><strong id="dataset-name">No dataset yet</strong><button id="upload-button" class="secondary">Upload dataset</button><input id="file" type="file" accept=".csv,.xlsx" hidden><small>CSV or Excel · up to 10 MB</small></div>
<nav id="chat-list" aria-label="Chats"></nav>
<div class="sidebar-bottom"><span class="status-dot"></span><span id="model-status">Connecting…</span></div></aside>
<main><header><button id="sidebar-toggle" class="icon-button" aria-label="Toggle sidebar" aria-controls="sidebar" aria-expanded="true">☰</button><div class="header-actions"><button id="view-data" class="text-button" disabled>View dataset</button><button id="clear" class="text-button" disabled>Clear chat</button></div></header>
<div class="content"><div id="notice" class="notice" hidden></div>
<section id="welcome" class="welcome"><h1>Ask your data</h1><p>Upload a CSV or Excel file to begin.</p><button id="sample" class="primary">Explore sample data</button></section>
<section class="explorer"><div id="suggestions" class="suggestions"></div><div id="conversation" aria-live="polite"></div><form id="chat-form"><textarea id="question" placeholder="Ask a question about your data…" rows="2" maxlength="4000" aria-label="Ask a question"></textarea><div class="composer-bottom"><span id="composer-hint">Upload a dataset to begin</span><button id="send" class="primary" type="submit" disabled>Send ↑</button></div></form></section>
</div></main>
<dialog id="dataset-dialog" aria-labelledby="dataset-title"><div class="dialog-heading"><h2 id="dataset-title">Dataset</h2><button id="close-data" class="text-button">Close</button></div><section id="overview" hidden><div class="stats"><div><span>Rows</span><strong id="rows">—</strong></div><div><span>Variables</span><strong id="cols">—</strong></div><div><span>Missing cells</span><strong id="missing">—</strong></div></div><h3>Preview · first 12 rows</h3><div id="preview-table" class="table-wrap"></div><div id="column-list" class="column-list"></div></section></dialog>
<script src="/static/vendor/echarts.min.js"></script><script src="/static/vendor/marked.min.js"></script><script src="/static/vendor/purify.min.js"></script><script src="/static/charts.js"></script><script src="/static/app.js"></script></body></html>
